id: servo/mg996r
kind: actuator.servo
verified: false            # becomes true after measuring physical samples
source: >-
  Public listings agree on the 40.7 x 19.7 x 42.9 mm envelope; flange height, hole pattern and
  shaft offset are nominal standard-size-servo values, not from a vendor drawing. Measure samples.
variants_note: many MG996R clones differ by ~0.5 mm; interface features use the print profile's clearance
mass_kg: 0.055

# Card frame = body_mount connector: origin on the flange underside (the face that rests on the
# bracket), centred on the mounting-hole pattern; +z toward the output shaft; +x along the long
# axis toward the shaft. The case hangs below z = 0 and drops into a pocket in the mounting part.
params_mm:
  body_l: 40.7             # case length (x)
  body_w: 19.7             # case width (y)
  body_below: 26.0         # flange underside -> case bottom
  case_above: 11.1         # flange underside -> case top (case height 37.1)
  flange_l: 54.6           # flange span (x)
  flange_t: 2.5            # flange thickness
  hole_pitch_x: 49.5       # mounting holes, rectangular pattern
  hole_pitch_y: 10.0
  hole_d: 4.5              # holes in the servo flange
  shaft_x: 10.0            # output shaft axis offset from the hole-pattern centre (x)
  spline_d: 5.8            # 25T spline outer diameter
  spline_top: 16.9         # flange underside -> spline tip (overall height 42.9)

actuation:
  type: revolute
  range_deg: [-90, 90]                              # typical; many units travel ~180 deg total
  stall_torque_Nm: { at_4_8V: 0.94, at_6V: 1.08 }   # datasheet values; verify per supplier
  speed_rad_s: { at_4_8V: 6.0, at_6V: 7.0 }         # approx.
  derating: 0.5                                     # design to <= 50% of stall torque
electrical: { voltage_V: [4.8, 7.2], stall_current_A: 2.5 }   # approx.; sizes the power note

# Connector values may name a param (see components/card.py).
connectors:
  body_mount:   { o: [0, 0, 0],                z: [0, 0, 1], x: [1, 0, 0], label: servo_mount }
  output_shaft: { o: [shaft_x, 0, spline_top], z: [0, 0, 1], x: [1, 0, 0], label: servo_horn }

# Read by the SDK's mount() / mate_to(); all in the card frame.
interfaces:
  mount_pocket:    { centre_xy: [0, 0], size: [body_l, body_w, body_below], top_z: 0 }   # case drops in from z = 0
  mount_holes:     { pattern: rect, pitch: [hole_pitch_x, hole_pitch_y], screw: M4, z: 0 }
  output_spline:   { teeth: 25, d_outer: spline_d, at: output_shaft }
  keep_out:
    - { box_min: [-35.35, -5.0, -26.0], box_max: [-20.35, 5.0, -18.0], reason: cable exit (approximate) }

model: generators/servo_mg996r.py   # envelope + exact interface features, bound to params_mm
